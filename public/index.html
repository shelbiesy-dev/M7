<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dreamy Fish Pond</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- The 3D sea is drawn into this element -->
  <div id="sea"></div>

  <!-- Status line: shown only when the button is not connected (docs/05_error_states.md) -->
  <p id="status" class="line status" hidden>Button not connected</p>

  <!-- Hint line: fades out after the first food drop -->
  <p id="hint" class="line hint">Move your mouse, press the button to feed.</p>

  <!-- Mute icon -->
  <button id="mute" class="mute" type="button" aria-label="Sound off — click to turn on" data-state="muted">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="speaker" d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/>
      <g class="waves">
        <path d="M15.2 9.2a4 4 0 0 1 0 5.6"/>
        <path d="M17.8 6.8a7.4 7.4 0 0 1 0 10.4"/>
      </g>
      <g class="cross">
        <path d="M15.5 9.5l5 5"/>
        <path d="M20.5 9.5l-5 5"/>
      </g>
    </svg>
  </button>

  <!-- Shown instead of the sea when it cannot be drawn (E8, E9) -->
  <div id="fatal" class="fatal" hidden><p></p></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
